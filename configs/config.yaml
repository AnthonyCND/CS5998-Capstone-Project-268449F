# Global seed for reproducibility
seed: 42

data:
  # NASA Prognostics Data Repository (zip contains a nested CMAPSSData.zip)
  url: "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
  raw_dir: data/raw/CMAPSSData
  processed_dir: data/processed
  subsets: [FD001, FD002]

# Values fixed in the Project Definition Document (Section 2.2)
preprocessing:
  rul_cap: 125
  window_size: 30
  drop_sensors:
    FD001: [1, 5, 6, 10, 16, 18, 19]
    # Same list as FD001 (02_eda_fd002.ipynb); keeping sensor 6 is still to be tested
    FD002: [1, 5, 6, 10, 16, 18, 19]
  # Z-score each sensor within its operating condition, using training statistics.
  # Required for FD002; for FD001 (one condition) it is a plain z-score.
  normalise_by_condition: true
