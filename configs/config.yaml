# Global seed for reproducibility
seed: 42

data:
  # NASA Prognostics Data Repository (zip contains a nested CMAPSSData.zip)
  url: "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
  raw_dir: data/raw/CMAPSSData
  processed_dir: data/processed
  subsets: [FD001, FD002]

# Values fixed in the Project Definition Document (Section 2.2)
preprocessing:
  rul_cap: 125
  window_size: 30
  drop_sensors:
    FD001: [1, 5, 6, 10, 16, 18, 19]
    # Same list as FD001 (02_eda_fd002.ipynb); keeping sensor 6 is still to be tested
    FD002: [1, 5, 6, 10, 16, 18, 19]
  # Z-score each sensor within its operating condition, using training statistics.
  # Required for FD002; for FD001 (one condition) it is a plain z-score.
  normalise_by_condition: true
  # Statistics of each sensor's window used as tree-model features, besides its
  # latest reading. Options: mean, std, min, max (PDD Section 2.2). Adding min and
  # max lowered validation scores for both baselines on FD001 and FD002, so the
  # default leaves them out; run the ablation with
  #   python -m src.models.baselines --rolling-stats mean std min max
  rolling_stats: [mean, std]

# Train/validation folds by engine (no engine in both); shuffled with the global seed
validation:
  n_splits: 5

# Test scores are reported against NASA's true (uncapped) RUL as the primary
# target, and against RUL capped at rul_cap for comparison
results_dir: results
# Final trained models with their fitted pipelines (git-ignored; created by training)
models_dir: models

# Baseline hyperparameters (starting values, not yet tuned)
models:
  random_forest:
    n_estimators: 300
    min_samples_leaf: 5
    max_features: 0.33
    n_jobs: -1
  xgboost:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1

# 1D-CNN + stacked BiLSTM (PDD Section 3.2); starting values, not yet tuned
cnn_bilstm:
  architecture:
    conv_channels: [32, 64]
    kernel_size: 3
    lstm_hidden: 64
    lstm_layers: 2
    dense: 64
    dropout: 0.2
  training:
    batch_size: 256
    learning_rate: 0.001
    max_epochs: 60
    # Stop after this many epochs without a better validation NASA score
    patience: 10
